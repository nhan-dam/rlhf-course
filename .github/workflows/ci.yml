name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reads .python-version, so CI and the workstation agree.
      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock is out of step with pyproject.toml, which is
      # the point: CI should test the resolution that is committed, and a stale
      # lock should be a red build rather than a silent re-resolve.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
