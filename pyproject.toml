[project]
name = "rlhf-course"
version = "0.1.0"
description = "An end-to-end RLHF pipeline (SFT, reward modelling, PPO) on a single workstation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "huggingface-hub>=1.9.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "peft>=0.18.1",
    "plotly>=6.6.0",
    "psutil>=5.9.0",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "tokenizers>=0.22.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.0",
    "trl>=1.0.0",
]

[project.optional-dependencies]
# Python dependencies of the Ollama export path (src/export/ppo_to_ollama.py):
# the GGUF container-format writer, plus sentencepiece, which llama.cpp's
# converter imports when building the vocabulary. The converter script itself
# (convert_hf_to_gguf.py) and the optional llama-quantize binary come from a
# separate llama.cpp checkout -- see OLLAMA.md -- not from this project's
# dependencies.
ollama = ["gguf>=0.10.0", "sentencepiece>=0.2.0"]

[tool.pytest.ini_options]
# Only collect from tests/, so stray scripts matching pytest's default
# 'test_*.py' / '*_test.py' patterns elsewhere in the repo are never imported
# (and thus executed) at collection time.
testpaths = ["tests"]

[dependency-groups]
# Installed by `uv sync` / `uv run` by default, but not part of the published
# package. Run the suite with: uv run pytest
dev = ["pytest>=8.0"]

[project.scripts]
rlhf-sft = "src.pipeline.sft_lora_dolly:main"
rlhf-rm = "src.pipeline.reward_model_hh:main"
rlhf-ppo = "src.pipeline.ppo_rlhf_loop:main"
rlhf-dpo = "src.pipeline.dpo_lora_hh:main"
rlhf-promote = "src.pipeline.promote_run:main"
rlhf-ppo-ollama = "src.export.ppo_to_ollama:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
